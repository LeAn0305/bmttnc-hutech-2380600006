<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rail Fence Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container" style="margin-top: 30px;">
        <table class="table">
            <tr>
                <td style="text-align: center; font-weight: bold; font-size: 25px;">RAILFENCE CIPHER</td>
            </tr>

            <tr>
                <td style="font-weight: bold; color: blue;">ENCRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form method="POST" action="railfence/encrypt" id="encryptForm">
                        <div class="mb-3">
                            <label class="form-label">Plain text:</label>
                            <input type="text" class="form-control" id="inputPlainText" name="inputPlainText" placeholder="Input Plain Text" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="number" class="form-control" id="inputKeyPlain" name="inputKeyPlain"
                                   placeholder="Input Key" required min="2">
                        </div>
                        <button type="submit" class="btn btn-primary">Encrypt</button>
                    </form>
                </td>
            </tr>

            <tr>
                <td style="font-weight: bold; color: blue;">DECRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form method="POST" action="railfence/decrypt" id="decryptForm">
                        <div class="mb-3">
                            <label class="form-label">Cipher text:</label>
                            <input type="text" class="form-control" id="inputCipherText" name="inputCipherText" placeholder="Input Cipher Text" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="number" class="form-control" id="inputKeyCipher" name="inputKeyCipher"
                                   placeholder="Input Key" required min="2">
                        </div>
                        <button type="submit" class="btn btn-primary">Decrypt</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>

    <script>
        // 1. Bắt lỗi form Mã hóa (Encryption)
        document.getElementById('encryptForm').addEventListener('submit', function(event) {
            const plainText = document.getElementById('inputPlainText').value.trim();
            const keyInput = document.getElementById('inputKeyPlain').value;
            
            // Kiểm tra số nguyên
            if (!Number.isInteger(Number(keyInput))) {
                alert("Lỗi: Key phải là một số nguyên (không nhập số thập phân)!");
                event.preventDefault(); // Chặn không cho gửi form
                return;
            }

            const key = parseInt(keyInput, 10);
            // Kiểm tra lỗi logic: Key >= độ dài chuỗi
            if (key >= plainText.length) {
                alert(`Lỗi logic: Key (Số hàng = ${key}) không được lớn hơn hoặc bằng độ dài văn bản (Độ dài hiện tại = ${plainText.length}). Nếu không văn bản sẽ giữ nguyên!`);
                event.preventDefault(); // Chặn không cho gửi form
            }
        });

        // 2. Bắt lỗi form Giải mã (Decryption)
        document.getElementById('decryptForm').addEventListener('submit', function(event) {
            const cipherText = document.getElementById('inputCipherText').value.trim();
            const keyInput = document.getElementById('inputKeyCipher').value;

            // Kiểm tra số nguyên
            if (!Number.isInteger(Number(keyInput))) {
                alert("Lỗi: Key phải là một số nguyên (không nhập số thập phân)!");
                event.preventDefault();
                return;
            }

            const key = parseInt(keyInput, 10);
            // Kiểm tra lỗi logic
            if (key >= cipherText.length) {
                alert(`Lỗi logic: Key (Số hàng = ${key}) không được lớn hơn hoặc bằng độ dài mật mã (Độ dài hiện tại = ${cipherText.length})!`);
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
